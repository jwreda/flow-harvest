[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowkit-gui"
version = "0.1.0"
description = "GUI tool for flow cytometry data analysis using FlowJo workspace files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "FlowKit>=1.0.0",
    "PyQt5>=5.15.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "numexpr>=2.10.0",
    "bottleneck>=1.4.0",
    "darkdetect>=0.8.0",
    "natsort>=8.0.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
]

[project.scripts]
flowkit-gui = "flowkit_gui.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
